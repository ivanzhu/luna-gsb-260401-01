<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞机大战</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="score-board">
                <span>分数: <span id="score">0</span></span>
                <span>最高分: <span id="highScore">0</span></span>
            </div>
            <div class="lives">
                <span>生命: </span>
                <span id="livesDisplay"></span>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="480" height="640"></canvas>
        
        <div class="game-overlay" id="startScreen">
            <h1>飞机大战</h1>
            <p>使用 WASD 移动，空格键发射子弹</p>
            <p>ESC 暂停游戏</p>
            <button id="startBtn">开始游戏</button>
        </div>
        
        <div class="game-overlay hidden" id="pauseScreen">
            <h2>游戏暂停</h2>
            <button id="resumeBtn">继续游戏</button>
        </div>
        
        <div class="game-overlay hidden" id="gameOverScreen">
            <h2>游戏结束</h2>
            <p>最终得分: <span id="finalScore">0</span></p>
            <button id="restartBtn">重新开始</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
